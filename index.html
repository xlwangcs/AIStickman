<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>AIStickman</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1c22;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 10;
        font: 12px/1.5 monospace;
        color: #cdd3e0;
        background: rgba(20, 22, 28, 0.85);
        border: 1px solid #3a3f4c;
        border-radius: 6px;
        padding: 6px 10px;
        max-height: 90vh;
        overflow-y: auto;
      }
      #panel summary {
        cursor: pointer;
        font-weight: bold;
      }
      #panel label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        margin: 2px 0;
      }
      #panel input[type='range'] {
        width: 110px;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <details id="panel"><summary>调参 tuning</summary></details>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
